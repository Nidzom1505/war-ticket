upstream frontend_upstream {
    server frontend:5173;
}

upstream api_upstream {
    server api:8000;
}

server {
    listen 80;
    server_name localhost;

    # ── API ─────────────────────────────────────────────
    # Semua request /api/* diteruskan ke Flask backend.
    location /api/ {
        proxy_pass         http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout lebih panjang untuk slow DB queries
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Vite HMR WebSocket ──────────────────────────────
    # Vite dev server menggunakan path ini untuk hot-reload.
    location /@vite/ {
        proxy_pass         http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    # ── Frontend SPA ────────────────────────────────────
    # Vue Router menggunakan history mode, jadi semua path
    # yang bukan /api/ harus diteruskan ke Vite dev server.
    # Vite sendiri menangani fallback ke index.html.
    location / {
        proxy_pass         http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (Vite HMR fallback)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }
}

# ── Upgrade map untuk WebSocket ──────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
